[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stgp"
version = "1.0.0"
description = "Spatial Temporal Gaussian Process (STGP) library in jax"
readme = { text = "", content-type = "text/markdown" }
authors = [
    { name = "Oliver Hamelijnck", email = "ohamelijnck@gmail.com"}
]
requires-python = ">=3.6"
license = { text = "MIT" }

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.ruff]
target-version = "py310"
line-length = 88

select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes (undefined vars, unused imports)
  "B",    # flake8-bugbear
]

ignore = [
  "E501",  # line length handled by formatter
  "E731",   # lambda assignment
  "E741",   # ambiguous variable names (i, j, k are fine)
  "PLR",    # pylint refactor rules
  "C90",    # mccabe complexity
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
show_error_codes = true

[project.urls]
Homepage = "N/A"


[tool.setuptools.packages.find]
where = ["."]
